<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
    
        .red{
            background-color: #546de5;
            color: #fff;
            padding: 15px;
            width: 50%;
            margin: 0 auto;
            font-family: "Roboto", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 500px 455px;
            cursor: pointer;
            transition: all 0.8s ease-in-out;
        }
        .red:hover{
            background-color: #2243e7;
            background-color: #322153;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1 class="title">Hello World</h1>
    <img src="" alt=""><br>
    <button>Click Me!</button>

    <script>
        let title = document.querySelector('h1');
        let btn = document.querySelector('button');

        // btn.addEventListener('click', function(e) {
        //     title.classList.toggle('red');
        // });

        btn.addEventListener('click', function() {
            document.querySelector('img').src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Unofficial_JavaScript_logo_2.svg/1200px-Unofficial_JavaScript_logo_2.svg.png';
            document.querySelector('img').style.width = '55%';
        });

        title.id = 'titleId';
        title.title = 'Hello World';
    </script>
</body>
</html>
